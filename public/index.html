<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0b2d6b">
<title>Evaluaciones de Seguimiento · Nivel Primario</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Merriweather:wght@700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b2d6b;--blue:#0b6bcb;--sky:#e6f3fd;--red:#d4202c;--ink:#1c2740;--mute:#64718a;--bg:#f4f7fb;--card:#fff;--ok:#1a9d6b;--warn:#e6a100;--line:#d6e2f1}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg)}
h1,h2,h3{margin:0;color:var(--navy)}.serif{font-family:Merriweather,Georgia,serif}
.top{display:flex;align-items:center;gap:14px;padding:12px 28px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{font-weight:800;color:var(--navy);cursor:pointer;display:flex;align-items:center;gap:10px}.brand i{width:12px;height:28px;background:linear-gradient(var(--navy) 70%,var(--red) 70%);border-radius:3px}
.top .sp{flex:1}select,input,button{font:inherit}select,input{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
.btn{border:0;border-radius:10px;padding:9px 16px;background:var(--navy);color:#fff;font-weight:600;cursor:pointer}.btn.alt{background:var(--sky);color:var(--navy)}.btn.red{background:var(--red)}.btn:hover{filter:brightness(1.1)}
main{max-width:1280px;margin:0 auto;padding:28px}
.hero{background:linear-gradient(135deg,var(--navy),#1a56b8);color:#fff;border-radius:24px;padding:48px;margin-bottom:26px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero h1{color:#fff;font-size:34px;line-height:1.2;max-width:720px}.hero p{max-width:640px;opacity:.88;margin:14px 0 0}.hero small{letter-spacing:.14em;text-transform:uppercase;opacity:.75;font-weight:700}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}.two{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--card);border-radius:20px;padding:24px;box-shadow:0 4px 18px rgba(11,45,107,.07);border:1px solid #e8eff8}
.cyc{cursor:pointer;transition:.2s;border-top:6px solid var(--blue)}.cyc:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(11,45,107,.15)}.cyc.c2{border-top-color:var(--red)}
.cyc h2{font-size:24px;margin:6px 0}.pill{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--sky);color:var(--navy);font-size:12px;font-weight:700;margin:2px 4px 2px 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin:18px 0 26px}.kpi b{display:block;font-size:30px;color:var(--navy)}.kpi span{color:var(--mute);font-size:13px}
.bar{height:8px;border-radius:9px;background:#e4ecf6;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);border-radius:9px}.bar.ok i{background:var(--ok)}
.av{width:44px;height:44px;border-radius:14px;background:var(--sky);color:var(--navy);font-weight:800;display:grid;place-items:center}
.chip{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;margin-top:8px;cursor:pointer}.chip:hover{border-color:var(--blue);background:var(--sky)}
.chip div{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:5px}.chip small{color:var(--mute)}
.crumb{color:var(--mute);margin-bottom:12px;font-size:14px}.crumb a{color:var(--blue);cursor:pointer;font-weight:600}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.sp{flex:1}.muted{color:var(--mute)}.warn{background:#fff6dd;border:1px solid #f0d58a;border-radius:12px;padding:10px 14px;margin:12px 0}
/* instrumentos oficiales */
.ofi{text-align:center;margin-bottom:10px}.ofi small{display:block;letter-spacing:.2em;font-size:10px;color:var(--navy)}.ofi b{font-family:Merriweather,serif;color:var(--red);font-size:15px;letter-spacing:.08em;border-top:3px solid var(--red);padding-top:3px;display:inline-block;margin-top:3px}.ofi div{font-weight:700;color:var(--navy);font-size:13px}
.ttl{text-align:center;color:var(--navy);font-weight:800;margin:8px 0}.meta{display:flex;gap:22px;flex-wrap:wrap;margin:10px 0 14px;font-size:14px}.meta b{color:var(--navy)}
.sc{overflow:auto;border:2px solid var(--blue);border-radius:6px;background:#fff;max-height:72vh}
table.mx{border-collapse:collapse;width:100%;font-size:12px}table.mx th,table.mx td{border:1px solid var(--blue);padding:5px 6px;text-align:center}
table.mx thead th{background:var(--sky);color:var(--navy);font-weight:700;position:sticky;top:0}table.mx td.nm,table.mx th.nm{text-align:left;min-width:230px;position:sticky;left:0;background:#fff;z-index:1}table.mx thead th.nm{background:var(--sky);z-index:3}
table.mx th.cp{font-weight:600;font-size:11px;line-height:1.3;text-align:left;max-width:360px}table.mx tfoot td{background:var(--sky);font-weight:800;color:var(--navy)}
td.cell{width:34px;min-width:34px;cursor:pointer;user-select:none}td.cell:hover{background:#f0f7ff}td.cell.on{color:#fff;font-weight:800}td.E.on{background:var(--red)}td.A.on{background:var(--warn)}td.S.on{background:var(--ok)}
tr.aus td:not(.nm):not(.ax){background:#f1f1f1;opacity:.6;cursor:not-allowed}.x{border:0;background:none;color:var(--blue);cursor:pointer;font-weight:700}
.rub{width:100%;border-collapse:collapse;font-size:12.5px}.rub th,.rub td{border:1px solid var(--blue);padding:7px 9px;vertical-align:top;text-align:left}.rub th{background:var(--sky);color:var(--navy);text-align:center}
dialog{border:0;border-radius:20px;padding:26px;width:min(420px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.3)}dialog::backdrop{background:rgba(11,45,107,.45)}dialog input{width:100%;margin:8px 0}
.toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;padding:10px 18px;border-radius:12px;opacity:0;transition:.3s;z-index:20}.toast.on{opacity:1}.toast.bad{background:var(--red)}
.only-print{display:none}
@media print{@page{size:landscape;margin:10mm}body{background:#fff}.top,.noprint,.crumb,.toast{display:none!important}.only-print{display:block}main{padding:0;max-width:none}.card{box-shadow:none;border:0;padding:0}.sc{max-height:none;overflow:visible;border-width:1px}td.cell.on{-webkit-print-color-adjust:exact;print-color-adjust:exact}table.mx thead th{position:static}table.mx td.nm{position:static}}

/* v2: matriz con encabezado fijo y diseño móvil */
html{-webkit-text-size-adjust:100%}
.sc{max-height:calc(100dvh - 150px);-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
table.mx{width:max-content;min-width:100%}table.mx th,table.mx td{padding:3px 4px}
table.mx thead tr.cr{display:none}table.mx thead th{top:0;height:34px;z-index:2}table.mx thead th.r3{top:34px}table.mx thead th.nm{z-index:4}
table.mx thead th.r2.cp{text-align:center;font-size:12px}.tx{display:none}.blank{border:0!important;background:#fff!important}
table.mx th.lv{min-width:36px;padding:2px}.lv .sh{display:inline-block;writing-mode:vertical-rl;transform:rotate(180deg);font-size:10.5px;white-space:nowrap;line-height:1.1}
td.cell{width:40px;min-width:40px;height:38px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}td.lvc.on{background:var(--blue)}
table.mx td.ax{min-width:34px}table.mx tfoot td{position:sticky;bottom:0;z-index:2}table.mx tfoot td.nm{z-index:4}
@media(max-width:760px){
 body{font-size:14px}main{padding:12px}.top{padding:8px 12px;gap:8px;flex-wrap:wrap}.brand{font-size:14px}#pw select{max-width:180px;font-size:12px;padding:6px}
 .hero{padding:26px 20px;border-radius:18px}.hero h1{font-size:22px}.card{padding:16px;border-radius:16px}h1{font-size:20px}h2{font-size:18px}
 .grid,.two{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr;gap:10px}.kpi b{font-size:22px}
 .row.noprint{gap:8px}.row.noprint h2{flex-basis:100%}.row.noprint .sp{display:none}.btn{padding:9px 12px;font-size:13px}.row.noprint select{flex:1;min-width:0}
 .meta{gap:8px 16px;font-size:13px}.ttl{font-size:12.5px}.sc{max-height:calc(100dvh - 120px)}
 table.mx td.nm,table.mx th.nm{min-width:132px;max-width:132px;font-size:11px;padding:3px 5px}td.cell{width:42px;min-width:42px}
 .rub,.rub tbody,.rub tr,.rub td{display:block;width:100%}.rub tr:first-child{display:none}.rub tr{border:1px solid var(--blue);border-radius:12px;margin-bottom:10px;overflow:hidden}
 .rub td{border:0;border-top:1px solid var(--line)}.rub td[data-l]:before{content:attr(data-l);display:block;font-weight:700;color:var(--navy);font-size:10.5px;text-transform:uppercase}.rub td.cp{background:var(--sky);font-weight:700}
}
@media print{table.mx thead tr.cr{display:table-row}.tx{display:inline}.sh{display:none}.lv .tx{display:inline-block;writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px}table.mx thead th{height:auto}table.mx tfoot td{position:static}table.mx{width:100%}}
</style>
</head>
<body>
<div class="top"><div class="brand" onclick="location.hash='#/'"><i></i>Evaluaciones · Nivel Primario</div><div class="sp"></div><span id="pw"></span><span id="us"></span></div>
<main id="app"></main><div class="toast" id="toast"></div><dialog id="dlg"></dialog>
<script>
const AR={LE:'Lengua Española',MAT:'Matemática',SOC:'Ciencias Sociales',CN:'Ciencias de la Naturaleza'},GR=['','Primer','Segundo','Tercer','Cuarto','Quinto','Sexto'],CY={1:'Primer Ciclo',2:'Segundo Ciclo'};
const S={tok:sessionStorage.tok||'',user:JSON.parse(sessionStorage.user||'null'),per:sessionStorage.per||'',boot:null};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),pct=(a,b)=>b?Math.round(100*a/b):0;
async function api(p,o={}){const r=await fetch('/api/'+p,{method:o.m||'GET',headers:{'content-type':'application/json',...(S.tok?{authorization:'Bearer '+S.tok}:{})},body:o.b?JSON.stringify(o.b):undefined});const d=await r.json().catch(()=>({}));if(!r.ok){if(r.status===401){logout(true)}throw new Error(d.error||'Error '+r.status)}return d}
function toast(m,bad){const t=$('#toast');t.textContent=m;t.className='toast on'+(bad?' bad':'');clearTimeout(t._t);t._t=setTimeout(()=>t.className='toast',2200)}
function logout(q){S.tok='';S.user=null;sessionStorage.removeItem('tok');sessionStorage.removeItem('user');if(!q){location.hash='#/'}drawTop()}
function drawTop(){const b=S.boot;$('#pw').innerHTML=b?`<select onchange="S.per=this.value;sessionStorage.per=S.per;S.boot=null;route()">${b.periodos.map(p=>`<option value="${p.id}" ${p.id===S.per?'selected':''}>${esc(p.nombre)}</option>`).join('')}</select>`:'';
 $('#us').innerHTML=S.user?`<span class="pill">${esc(S.user.nombre)}</span><button class="btn alt" onclick="logout()">Salir</button>`:''}
async function boot(c){const d=await api(`boot?ciclo=${c}&periodo=${S.per}`);S.per=d.periodo;sessionStorage.per=S.per;S.boot=d;drawTop();return d}
const tipo=()=>S.boot?.periodos.find(p=>p.id===S.per)?.tipo==='diagnostica'?'evaluación diagnóstica':'evaluación de seguimiento';
const anio=()=>S.boot?.centro?.anio||'2026-2027';
const ofi=()=>`<div class="ofi only-print"><small>GOBIERNO DE LA REPÚBLICA DOMINICANA</small><b>EDUCACIÓN</b><div>Dirección de Educación Primaria</div></div>`;
const isStaff=c=>S.user&&(S.user.r==='admin'||(S.user.r==='coord'&&S.user.ciclo===c));
window.onhashchange=route;route();
async function route(){const[,v,a]=location.hash.split('/');try{v==='c'?await cycle(+a):v==='eval'?await evalView(+a):v==='consol'?await consol(+a):await landing()}catch(e){fail(e)}window.scrollTo(0,0)}
function fail(e){const noDb=/relation|does not exist|DATABASE_URL|fetch failed/i.test(e.message);$('#app').innerHTML=noDb?`<div class="card" style="max-width:520px;margin:40px auto"><h2>Configuración inicial</h2><p class="muted">La base de datos en Neon aún no tiene las tablas. Ingrese el PIN de administración (variable <b>ADMIN_PIN</b> en Netlify) para crearlas y cargar docentes, secciones, estudiantes e instrumentos oficiales.</p><input id="ap" type="password" placeholder="PIN de administración"><button class="btn" onclick="init()">Inicializar base de datos</button></div>`:`<div class="card"><h2>No se pudo cargar</h2><p>${esc(e.message)}</p><button class="btn" onclick="route()">Reintentar</button></div>`}
async function init(){try{const r=await api('init',{m:'POST',b:{pin:$('#ap').value}});toast(`Listo: ${r.estudiantes} estudiantes, ${r.asignaciones} asignaciones`);route()}catch(e){toast(e.message,1)}}
async function landing(){const d=await boot(1);$('#app').innerHTML=`<div class="hero"><small>Ministerio de Educación · Año escolar ${esc(anio())}</small><h1 class="serif">Registro y consolidación de evaluaciones diagnósticas y de seguimiento</h1><p>Seleccione el ciclo que le corresponde. Cada docente registra los resultados de sus secciones con las matrices y rúbricas oficiales; la coordinación supervisa el avance y obtiene los consolidados.</p></div>
<div class="grid two"><div class="card cyc" onclick="location.hash='#/c/1'"><span class="pill">1.º · 2.º · 3.º</span><h2>Primer Ciclo</h2><p class="muted">Lengua Española, Matemática y niveles de lectura.</p><button class="btn">Entrar al ciclo →</button></div>
<div class="card cyc c2" onclick="location.hash='#/c/2'"><span class="pill">4.º · 5.º · 6.º</span><h2>Segundo Ciclo</h2><p class="muted">Lengua Española, Matemática, Ciencias Sociales y Ciencias de la Naturaleza.</p><button class="btn red">Entrar al ciclo →</button></div></div>
<p class="muted" style="margin-top:24px">${esc(d.centro.nombre||'')} · <a href="#" onclick="adminLogin();return false">Administración</a></p>`}
function adminLogin(){dlg(`<h3>Administración</h3><input id="pn" type="password" placeholder="PIN de administración"><div class="row"><button class="btn" onclick="doLogin({admin:true,pin:$('#pn').value})">Entrar</button></div>`)}
function dlg(h){const d=$('#dlg');d.innerHTML=h;d.showModal();const i=d.querySelector('input');i&&i.focus()}
async function doLogin(b,go){try{const r=await api('login',{m:'POST',b});S.tok=r.token;S.user=r.user;sessionStorage.tok=r.token;sessionStorage.user=JSON.stringify(r.user);$('#dlg').close();drawTop();go?go():route()}catch(e){toast(e.message,1)}}
function userLogin(u,go){window._go=go;dlg(`<h3>${esc(u.nombre)}</h3><p class="muted">${u.tiene_pin?'Ingrese su PIN.':'Primer acceso: cree su PIN personal (4 a 8 dígitos).'}</p><input id="pn" type="password" inputmode="numeric" placeholder="PIN">${!u.tiene_pin&&u.rol==='coord'?'<input id="ap" type="password" placeholder="PIN de administración (primer acceso)">':''}<div class="row"><button class="btn" onclick="doLogin({id:${u.id},pin:$('#pn').value,admin_pin:$('#ap')?.value},window._go)">Continuar</button></div>`)}
async function cycle(c){const d=await boot(c),A=d.asig,tot=A.reduce((s,a)=>s+a.total,0),done=A.reduce((s,a)=>s+a.hechos,0);
 const docs=d.docs.filter(x=>x.rol==='docente'),coord=d.docs.find(x=>x.rol==='coord');
 $('#app').innerHTML=`<div class="crumb"><a href="#/">Inicio</a> › ${CY[c]}</div><div class="row"><h1>${CY[c]} · ${esc(d.periodos.find(p=>p.id===d.periodo)?.nombre||'')}</h1><div class="sp"></div>
 ${isStaff(c)?`<button class="btn" onclick="location.hash='#/consol/${c}'">Consolidados</button>`:`<button class="btn alt" onclick="staffLogin(${c})">Acceso coordinación</button>`}${S.user?.r==='admin'?`<button class="btn alt" onclick="centro()">Datos del centro</button>`:''}</div>
 <div class="kpis"><div class="card kpi"><b>${pct(done,tot)}%</b><span>avance global del ciclo</span><div class="bar" style="margin-top:8px"><i style="width:${pct(done,tot)}%"></i></div></div><div class="card kpi"><b>${docs.length}</b><span>docentes con evaluaciones asignadas</span></div><div class="card kpi"><b>${A.filter(a=>a.hechos>=a.total&&a.total).length}/${A.length}</b><span>secciones-áreas completas</span></div><div class="card kpi"><b>${done}/${tot}</b><span>estudiantes-áreas evaluados</span></div></div>
 <div class="grid">${docs.map(t=>{const mine=A.filter(a=>a.docente_id===t.id);return`<div class="card"><div class="row"><div class="av">${esc(t.nombre.split(' ').map(w=>w[0]).slice(0,2).join(''))}</div><div><b>${esc(t.nombre)}</b><div class="muted" style="font-size:13px">${mine.length} asignaciones</div></div></div>${mine.map(a=>`<button class="chip" onclick="openAsig(${a.id},${t.id},${c})"><div><span>${GR[a.grado]} ${a.letra} · ${AR[a.area]}</span><small>${a.hechos}/${a.total}</small></div><div class="bar ${a.hechos>=a.total&&a.total?'ok':''}"><i style="width:${pct(a.hechos,a.total)}%"></i></div></button>`).join('')}</div>`}).join('')}</div>`;window._boot=d;window._coord=coord}
function openAsig(id,tid,c){const go=()=>location.hash='#/eval/'+id;if(isStaff(c)||S.user?.id===tid)return go();userLogin(S.boot.docs.find(x=>x.id===tid),go)}
function staffLogin(c){const co=S.boot.docs.find(x=>x.rol==='coord');if(co)userLogin(co,()=>route());else adminLogin()}
function centro(){const c=S.boot.centro;dlg(`<h3>Datos del centro</h3>${['nombre','codigo','regional','distrito','sector','tipo','tanda','director','anio'].map(k=>`<label class="muted">${k}</label><input id="k_${k}" value="${esc(c[k]||'')}">`).join('')}<button class="btn" onclick="saveCentro()">Guardar</button>`)}
async function saveCentro(){const o={};['nombre','codigo','regional','distrito','sector','tipo','tanda','director','anio'].forEach(k=>o[k]=$('#k_'+k).value);await api('ajustes',{m:'PUT',b:o});$('#dlg').close();toast('Guardado');route()}
/* ---------- matriz de evaluación (instrumento del docente) ---------- */
let E={};
async function evalView(id){if(!S.user){location.hash='#/';return}if(!S.boot)await boot(1);const d=await api(`seccion?asig=${id}&periodo=${S.per}`);E={id,a:d.asig,def:d.def,est:d.est.filter(e=>e.activo).map(e=>({...e,res:e.resultados||{}})),open:false,c:d.asig.grado<=3?1:2,her:d.heredado};
 const A=E.a,cen=S.boot.centro;$('#app').innerHTML=`<div class="crumb noprint"><a href="#/">Inicio</a> › <a href="#/c/${E.c}">${CY[E.c]}</a> › ${GR[A.grado]} ${A.letra} · ${AR[A.area]}</div>
 <div class="card">${ofi()}<div class="row noprint"><h2>${GR[A.grado]} grado · Sección ${A.letra} · ${AR[A.area]}</h2><div class="sp"></div><span id="sv" class="muted"></span><button class="btn alt" onclick="E.open=!E.open;drawRub()">Ver rúbrica</button><button class="btn alt" onclick="addEst()">+ Inscribir alumno</button><button class="btn" onclick="print()">Imprimir / PDF</button></div>
 ${E.her?`<div class="warn noprint">Este período no tiene instrumento propio cargado: se muestra el instrumento de <b>${E.her}</b>.</div>`:''}${E.def.pendiente?`<div class="warn noprint">La rúbrica oficial de esta área y grado no estaba en los documentos entregados; se usan los indicadores del formulario del distrito. Puede evaluar normalmente.</div>`:''}
 <div id="rub"></div><div class="ttl">Instrumento para el docente consolidar resultados de la ${tipo()}, Año Escolar ${esc(anio())}<br>${GR[A.grado].toUpperCase()} GRADO · ${AR[A.area].toUpperCase()}</div>
 <div class="meta"><span><b>Centro Educativo:</b> ${esc(cen.nombre||'')}</span><span><b>Sección:</b> ${A.letra}</span><span id="mt"></span></div><div class="sc"><table class="mx" id="mx"></table></div></div>`;
 $('#mx').onclick=ev=>{const t=ev.target.closest('.cell');if(t)t.dataset.n?setN(+t.dataset.e,t.dataset.n):setR(+t.dataset.e,t.dataset.i,t.dataset.v);const b=ev.target.closest('[data-ed]');if(b)editEst(+b.dataset.ed)};
 $('#mx').onchange=ev=>{const t=ev.target;if(t.dataset.au)setAus(+t.dataset.au,t.checked)};draw()}
function drawRub(){const d=E.def,el=$('#rub');if(!E.open){el.innerHTML='';return}
 el.innerHTML=`<table class="rub" style="margin:14px 0"><tr><th>Competencia</th><th>Indicador</th><th>Ítems</th><th>Elemental</th><th>Aceptable</th><th>Satisfactorio</th></tr>${d.comps.map(c=>c.inds.map((i,k)=>`<tr>${k?'':`<td class="cp" rowspan="${c.inds.length}">${esc(c.t)}</td>`}<td data-l="Indicador"><b>${i.c}</b> ${esc(i.t)}</td><td data-l="Ítems">${esc(i.it)}</td><td data-l="Elemental">${esc(i.E)}</td><td data-l="Aceptable">${esc(i.A)}</td><td data-l="Satisfactorio">${esc(i.S)}</td></tr>`).join('')).join('')}</table>
 ${d.lec&&d.lec[0].d?`<table class="rub" style="margin-bottom:14px"><tr><th>Nivel de lectura</th><th>Características</th></tr>${d.lec.map(l=>`<tr><td data-l="Nivel de lectura"><b>${esc(l.n)}</b></td><td data-l="Características">${esc(l.d)}</td></tr>`).join('')}</table>`:''}`}
const SH={F:'Con fluidez',SF:'Sin fluidez',P:'Palabras',S:'Sílabas',I:'Imágenes'};
function draw(){const d=E.def,inds=d.comps.flatMap(c=>c.inds),lec=d.lec||[],nl=lec.length,ks=['E','A','S'],sh=l=>E.c===1?(SH[l.c]||l.n):l.n;
 const done=E.est.filter(e=>!e.ausente&&(Object.keys(e.res).length||e.nivel)).length;$('#mt').innerHTML=`<b>Matriculados:</b> ${E.est.length} &nbsp; <b>Evaluados:</b> ${done}`;
 $('#mx').innerHTML=`<thead><tr class="cr"><th class="blank" colspan="3"></th>${d.comps.map(c=>`<th class="cp" colspan="${c.inds.length*3}">${esc(c.t)}</th>`).join('')}${nl?`<th colspan="${nl}">Nivel de lectura</th>`:''}</tr>
 <tr><th rowspan="2" class="r2">No.</th><th rowspan="2" class="r2 nm">Nombres de estudiantes</th><th rowspan="2" class="r2">Aus.</th>${inds.map(i=>`<th class="r2 cp" colspan="3" title="${esc(i.t)}"><b>${i.c}</b><span class="tx"> ${esc(i.t)}</span></th>`).join('')}${lec.map(l=>`<th rowspan="2" class="r2 lv" title="${esc(l.n)}"><span class="sh">${esc(sh(l))}</span><span class="tx">${esc(l.n)}</span></th>`).join('')}</tr>
 <tr>${inds.map(()=>ks.map(k=>`<th class="r3">${k}</th>`).join('')).join('')}</tr></thead>
 <tbody>${E.est.map((e,n)=>`<tr class="${e.ausente?'aus':''}"><td>${n+1}</td><td class="nm"><button class="x noprint" data-ed="${e.id}" title="Editar">✎</button> ${esc(e.apellidos)}, ${esc(e.nombres)}</td><td class="ax"><input type="checkbox" data-au="${e.id}" ${e.ausente?'checked':''}></td>${inds.map(i=>ks.map(k=>`<td class="cell ${k} ${e.res[i.c]===k?'on':''}" data-e="${e.id}" data-i="${i.c}" data-v="${k}">${e.res[i.c]===k?k:''}</td>`).join('')).join('')}${lec.map(l=>`<td class="cell lvc ${e.nivel===l.c?'on':''}" data-e="${e.id}" data-n="${l.c}">${e.nivel===l.c?'✓':''}</td>`).join('')}</tr>`).join('')}</tbody>
 <tfoot><tr><td></td><td class="nm" style="background:var(--sky)">Total</td><td>${E.est.filter(e=>e.ausente).length}</td>${inds.map(i=>ks.map(k=>`<td>${E.est.filter(e=>e.res[i.c]===k&&!e.ausente).length}</td>`).join('')).join('')}${lec.map(l=>`<td>${E.est.filter(e=>e.nivel===l.c&&!e.ausente).length}</td>`).join('')}</tr></tfoot>`}
const get=id=>E.est.find(e=>e.id===id);
function setR(id,i,v){const e=get(id);if(e.ausente)return;e.res[i]===v?delete e.res[i]:e.res[i]=v;save(e)}
function setN(id,v){const e=get(id);if(e.ausente)return;e.nivel=e.nivel===v?null:v;save(e)}
function setAus(id,v){const e=get(id);e.ausente=v;save(e)}
async function save(e){draw();$('#sv').textContent='Guardando…';try{await api('eval',{m:'PUT',b:{periodo:S.per,est:e.id,area:E.a.area,res:e.res,nivel:e.nivel,ausente:e.ausente}});$('#sv').textContent='Guardado ✓'}catch(x){$('#sv').textContent='';toast(x.message,1)}}
async function addEst(){const ap=prompt('Apellidos del estudiante');if(!ap)return;const no=prompt('Nombres');if(!no)return;const ma=prompt('Matrícula (opcional)')||'';try{await api('estudiante',{m:'POST',b:{seccion_id:E.a.seccion_id,apellidos:ap,nombres:no,matricula:ma}});toast('Estudiante inscrito');evalView(E.id)}catch(x){toast(x.message,1)}}
async function editEst(id){const e=get(id),ap=prompt('Apellidos',e.apellidos);if(!ap)return;const no=prompt('Nombres',e.nombres);if(!no)return;const ma=prompt('Matrícula',e.matricula||'')||'';const act=!confirm('¿Retirar a este estudiante de la sección? (Aceptar = retirar, Cancelar = mantener)');
 try{await api('estudiante',{m:'POST',b:{id,seccion_id:E.a.seccion_id,apellidos:ap,nombres:no,matricula:ma,activo:act}});toast('Actualizado');evalView(E.id)}catch(x){toast(x.message,1)}}
/* ---------- consolidado del coordinador (instrumento oficial) ---------- */
async function consol(c){if(!isStaff(c)){location.hash='#/c/'+c;return}const d=await boot(c),g=+(sessionStorage.cg||(c===1?1:4)),ar=sessionStorage.ca||'LE';
 const grados=c===1?[1,2,3]:[4,5,6],areas=c===1?['LE','MAT']:['LE','MAT','SOC','CN'],ar2=areas.includes(ar)?ar:'LE';
 const first=d.asig.find(a=>a.grado===g&&a.area===ar2),[sec,cons]=await Promise.all([api(`seccion?asig=${first.id}&periodo=${S.per}`),api(`consol?ciclo=${c}&periodo=${S.per}`)]);
 const def=sec.def,inds=def.comps.flatMap(i=>i.inds),rows=cons.rows.filter(r=>r.grado===g),letras=[...new Set(rows.map(r=>r.letra))].sort(),ks=['E','A','S'];
 const L=l=>{const m=new Set(rows.filter(r=>r.letra===l).map(r=>r.est)).size,ev=rows.filter(r=>r.letra===l&&r.area===ar2&&!r.ausente&&Object.keys(r.resultados||{}).length);return{l,m,ev,n:ev.length}};
 const nv=(l,c)=>rows.filter(r=>r.letra===l&&r.area==='LE'&&!r.ausente&&r.nivel===c).length,data=letras.map(L),sum=f=>data.reduce((s,x)=>s+f(x),0),cnt=(x,i,k)=>x.ev.filter(r=>r.resultados[i.c]===k).length;
 $('#app').innerHTML=`<div class="crumb noprint"><a href="#/">Inicio</a> › <a href="#/c/${c}">${CY[c]}</a> › Consolidados</div><div class="card">${ofi()}
 <div class="row noprint"><h2>Consolidados del ciclo</h2><div class="sp"></div><select onchange="sessionStorage.cg=this.value;route()">${grados.map(x=>`<option value="${x}" ${x===g?'selected':''}>${GR[x]} grado</option>`).join('')}</select><select onchange="sessionStorage.ca=this.value;route()">${areas.map(x=>`<option value="${x}" ${x===ar2?'selected':''}>${AR[x]}</option>`).join('')}</select><button class="btn" onclick="print()">Imprimir / PDF</button></div>
 <div class="ttl">Instrumento para el coordinador pedagógico/director consolidar resultados de la ${tipo()}, Año Escolar ${esc(anio())}<br>${GR[g].toUpperCase()} GRADO · ${AR[ar2].toUpperCase()}</div>
 <div class="meta"><span><b>Centro Educativo:</b> ${esc(d.centro.nombre||'')}</span><span><b>Matriculados:</b> ${sum(x=>x.m)}</span><span><b>Evaluados:</b> ${sum(x=>x.n)}</span></div>
 <div class="sc"><table class="mx"><thead><tr class="cr"><th class="blank" colspan="3"></th>${def.comps.map(k=>`<th class="cp" colspan="${k.inds.length*3}">${esc(k.t)}</th>`).join('')}</tr><tr><th rowspan="2" class="r2">Sección</th><th rowspan="2" class="r2">Matrícula</th><th rowspan="2" class="r2">Evaluados</th>${inds.map(i=>`<th class="r2 cp" colspan="3" title="${esc(i.t)}"><b>${i.c}</b><span class="tx"> ${esc(i.t)}</span></th>`).join('')}</tr><tr>${inds.map(()=>ks.map(k=>`<th class="r3">${k}</th>`).join('')).join('')}</tr></thead>
 <tbody>${data.map(x=>`<tr><td><b>${x.l}</b></td><td>${x.m}</td><td>${x.n}</td>${inds.map(i=>ks.map(k=>`<td>${cnt(x,i,k)}</td>`).join('')).join('')}</tr>`).join('')}</tbody>
 <tfoot><tr><td>Total</td><td>${sum(x=>x.m)}</td><td>${sum(x=>x.n)}</td>${inds.map(i=>ks.map(k=>`<td>${sum(x=>cnt(x,i,k))}</td>`).join('')).join('')}</tr></tfoot></table></div>
 <p class="muted">E: Elemental · A: Aceptable · S: Satisfactorio</p>
 ${def.lec?`<div class="ttl" style="margin-top:26px">CONSOLIDADO DEL CENTRO EDUCATIVO DE LOS NIVELES DE LECTURA<br>${GR[g].toUpperCase()} GRADO</div><div class="sc"><table class="mx"><thead><tr><th>Secciones</th>${def.lec.map(l=>`<th>${esc(l.n)}</th>`).join('')}</tr></thead><tbody>${data.map(x=>`<tr><td><b>${x.l}</b></td>${def.lec.map(l=>`<td>${nv(x.l,l.c)}</td>`).join('')}</tr>`).join('')}</tbody><tfoot><tr><td>Total</td>${def.lec.map(l=>`<td>${sum(x=>nv(x.l,l.c))}</td>`).join('')}</tr></tfoot></table></div>`:''}</div>`}
</script>
